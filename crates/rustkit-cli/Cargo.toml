[package]
name = "rustkit-cli"
description = "The `rustkit` command: create apps, add pages, check them, and run a development server that reloads on save"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "rustkit"
path = "src/main.rs"

[dependencies]
rustkit-compiler = { path = "../rustkit-compiler" }
serde_json = "1"
libc = "0.2"
