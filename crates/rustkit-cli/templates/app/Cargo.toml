[package]
name = "{{name}}"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rustkit = {{rustkit_dep}}
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
rustkit-compiler = {{compiler_dep}}

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
