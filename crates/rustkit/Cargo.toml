[package]
name = "rustkit"
description = "Runtime for Rust-kit: request context, sessions, CSRF, routing and the shared JS value semantics"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
axum = { version = "0.8", features = ["form", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.4"
futures-core = "0.3"
