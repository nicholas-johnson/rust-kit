[package]
name = "account-demo"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
rustkit = { path = "../../crates/rustkit" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
rustkit-compiler = { path = "../../crates/rustkit-compiler" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
